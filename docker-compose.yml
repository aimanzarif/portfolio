services:
  web:
    container_name: portfolio
    image: zarif-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://zarep.my}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL:-https://uptimekuma.zarep.my}
      UPTIME_KUMA_SLUG: ${UPTIME_KUMA_SLUG:-zarep}
      CF_BEACON_TOKEN: ${CF_BEACON_TOKEN:-}
      NETDATA_URL: ${NETDATA_URL:-http://netdata:19999}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-zarep.my,www.zarep.my,staging.zarep.my}
      GUESTBOOK_ADMIN_TOKEN: ${GUESTBOOK_ADMIN_TOKEN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://zarep.my}
    extra_hosts:
      # Lets the container reach services on the laptop itself (Netdata)
      - "host.docker.internal:host-gateway"
    volumes:
      # Guestbook entries survive rebuilds
      - guestbook-data:/app/data
    networks:
      - proxy-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  guestbook-data:

networks:
  proxy-net:
    # Shared with Nginx Proxy Manager and Uptime Kuma (needed for the live status panel).
    external: true
    name: nginx-proxy-manager_proxy-net
